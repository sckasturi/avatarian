# Deploy the static site in site/ to GitHub Pages.
#
# The app is plain HTML/CSS/JS with no build step (the glyph manifest is
# embedded inline; every asset path is relative), so "building" is just
# uploading site/ as the Pages artifact. Legacy branch-based Pages can only
# serve the repo root or /docs, never a /site subfolder — hence Actions.
name: Deploy site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege for the deploy: read the repo, write Pages, mint the OIDC
# token deploy-pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight run finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
