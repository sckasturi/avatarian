# Run the test suite, and check that every generated file is up to date.
#
# The Pages deploy (pages.yml) uploads site/ as it is committed — there is no
# build step — so a generated file that has fallen behind its source ships
# stale. This is the check that catches it: rebuild everything from source
# and fail if the result differs from what is committed.
#
# It does not gate the deploy. A red run here is a notice, not a blocked
# site; make pages.yml `needs` this job if that should change.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # tests/lua_golden.test.js proves the wiki's Lua renderer still matches
      # render.js. It SKIPS when there is no `lua`, so without this step the
      # one test guarding the hand-ported renderer never ran in CI.
      - name: Install Lua
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          lua -v

      # No dependencies to install — stdlib + node's built-in runner.
      - name: Run the test suite
        run: python3 tools/run_tests.py

      # Everything generated, rebuilt from source in dependency order.
      # (site/js/lexicon.js is not here: it is built from CMUdict, which is
      # not in the repo — see tools/build_lexicon.py.)
      - name: Rebuild generated files
        run: |
          python3 tools/build_glyphs.py
          python3 tools/build_manifest.py
          python3 tools/build_corpus.py
          python3 tools/build_lua_module.py
          python3 tools/build_css_only.py

      - name: Generated files are up to date
        run: |
          if ! git diff --exit-code --stat; then
            echo "::error::Generated files are out of date. Re-run the build scripts (see README, Build) and commit the result."
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::The build wrote files that are not committed."
            exit 1
          fi
