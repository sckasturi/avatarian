<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>By source — corpus reference</title>
<link rel="stylesheet" href="css/blocks.css">
<style>
  body { background:#1a1512; color:#ece0cc; font:15px/1.5 system-ui, sans-serif; margin:0; padding:24px; }
  h1 { font-size:1.2rem; margin:0 0 4px; }
  p.sub { color:#a8967c; margin:0 0 20px; }
  .controls { margin-bottom:16px; }
  select { font:inherit; background:#241c17; color:#ece0cc; border:1px solid #4a3d2e; border-radius:8px; padding:6px 10px; }
  .source { border:1px solid #4a3d2e; border-radius:12px; padding:18px; margin-bottom:22px;
            display:grid; grid-template-columns:minmax(240px,380px) 1fr; gap:22px; align-items:start; }
  .source-img { position:sticky; top:12px; }
  .source-img img { width:100%; border-radius:8px; border:1px solid #4a3d2e; background:#0d0a08; display:block; }
  .source-img .cap { color:#a8967c; font-size:.8rem; margin-top:8px; }
  .source-img .cap b { color:#ece0cc; }
  .source-img a { color:#d98e6d; font-size:.78rem; }
  .words { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:14px; }
  .w { border:1px solid #3a2f22; border-radius:8px; padding:10px; background:#241c17;
       display:flex; flex-direction:column; align-items:center; gap:6px; }
  .w .draw { --av-size:52px; min-height:96px; display:flex; align-items:center; }
  .w .en { font-weight:600; }
  .w .en.alt { color:#d98e6d; }
  .w .snd { color:#a8967c; font-size:.78rem; font-family:ui-monospace, monospace; text-align:center; }
  .w .cc { color:#d98e6d; font-size:.72rem; font-weight:600; }
</style></head><body>
<h1>Corpus by source</h1>
<p class="sub">Each reference image with every word read off it, drawn in the spelling <em>that source</em> used.
Compare the drawing to the photo. A <b>∗</b> marks a source that spelled a word differently from the corpus winner.</p>
<div class="controls">source:
  <select id="pick"><option value="">— all, richest first —</option></select>
  &nbsp;&nbsp;<label><input type="checkbox" id="ccOnly" checked> C-C blocks only</label>
  &nbsp;&nbsp;pair: <select id="pairPick"><option value="">— any —</option></select>
</div>
<div id="out"></div>

<script src="js/manifest.js"></script>
<script src="js/corpus.js"></script>
<script src="js/lexicon.js"></script>
<script src="js/g2p.js"></script>
<script src="js/sounds.js"></script>
<script src="js/render.js"></script>
<script>
(function () {
  var CORPUS = window.AVATARIAN_CORPUS, SOURCES = CORPUS.sources || {};
  function allSourcesOf(w){ var s=new Set(w.sources||[]); (w.alternates||[]).forEach(function(a){(a.sources||[]).forEach(function(x){s.add(x);});}); return Array.from(s); }
  function spellingInSource(w,id){ if((w.sources||[]).includes(id)) return {ipa:w.ipa,alt:false}; var r=null; (w.alternates||[]).forEach(function(a){ if((a.sources||[]).includes(id)) r={ipa:a.ipa,alt:true}; }); return r||{ipa:w.ipa,alt:false}; }
  var code = window.soundToCode || function(x){return x;};
  var baseOf = function(t){ return String(t).replace(/[$%]/g,''); };
  var isCons = function(s){ return !isVowelSymbol(s) && !NULLS.has(baseOf(s)) && baseOf(s)!=='*'; };
  function ccPairs(ipa){ var out=[]; resolveBlocks(ipa).forEach(function(b){ if(isCons(b.top)&&isCons(b.bottom)) out.push(baseOf(b.top)+' / '+baseOf(b.bottom)); }); return out; }

  var bySource = {};
  Object.keys(SOURCES).forEach(function(id){ bySource[id]=[]; });
  Object.keys(CORPUS.words||{}).forEach(function(key){
    var w = CORPUS.words[key], label = w.gloss || key;
    allSourcesOf(w).forEach(function(id){ (bySource[id]||(bySource[id]=[])).push(Object.assign({key:key,label:label}, spellingInSource(w,id))); });
  });

  var order = Object.keys(bySource).filter(function(id){return bySource[id].length;})
    .sort(function(a,b){return bySource[b].length - bySource[a].length;});

  var pick = document.getElementById('pick');
  order.forEach(function(id){ var o=document.createElement('option'); o.value=id; o.textContent=id+' ('+bySource[id].length+')'; pick.appendChild(o); });

  function drawSource(id){
    var s = SOURCES[id]||{}, items = bySource[id]||[];
    var ccOnly = document.getElementById('ccOnly').checked;
    var wantPair = document.getElementById('pairPick').value;
    // filter items by the C-C options, computing each word's C-C pairs
    var shown = items.map(function(it){ return Object.assign({pairs:ccPairs(it.ipa)}, it); })
      .filter(function(it){
        if (ccOnly && !it.pairs.length) return false;
        if (wantPair && it.pairs.indexOf(wantPair) < 0) return false;
        return true;
      });
    if (!shown.length) return null;

    var el = document.createElement('div'); el.className='source';
    var left = document.createElement('div'); left.className='source-img';
    if (s.image){ var im=document.createElement('img'); im.src='sources/'+encodeURIComponent(s.image); im.alt=id; left.appendChild(im); }
    var cap=document.createElement('div'); cap.className='cap';
    cap.innerHTML='<b>'+id+'</b> · '+shown.length+' of '+items.length+' words<br>'+(s.what?('<span style="font-style:italic">'+s.what+'</span>'):'');
    if (s.where && /^https?:/.test(s.where)) cap.innerHTML += '<br><a href="'+s.where+'" target="_blank">source ↗</a>';
    left.appendChild(cap); el.appendChild(left);
    var right=document.createElement('div'); right.className='words';
    shown.sort(function(a,b){return a.label.localeCompare(b.label);}).forEach(function(it){
      var w=document.createElement('div'); w.className='w';
      var d=document.createElement('div'); d.className='draw avatarian-word'; renderAvatarian(it.ipa, d);
      var en=document.createElement('div'); en.className='en'+(it.alt?' alt':''); en.textContent=it.label+(it.alt?' ∗':'');
      var snd=document.createElement('div'); snd.className='snd';
      snd.textContent = it.ipa.map(function(t){ return /^[.,?!]$/.test(t)?t : (t==='∅'||t==='∅c'?'0':code(t)); }).join(' ');
      w.appendChild(d); w.appendChild(en); w.appendChild(snd);
      if (it.pairs.length){ var cc=document.createElement('div'); cc.className='cc'; cc.textContent=it.pairs.map(function(p){return '('+p+')';}).join(' '); w.appendChild(cc); }
      right.appendChild(w);
    });
    el.appendChild(right); return el;
  }

  // populate the pair dropdown with every C-C pair in the corpus (richest first)
  var pairCounts = {};
  order.forEach(function(id){ bySource[id].forEach(function(it){ ccPairs(it.ipa).forEach(function(p){ pairCounts[p]=(pairCounts[p]||0)+1; }); }); });
  Object.keys(pairCounts).sort(function(a,b){return pairCounts[b]-pairCounts[a];}).forEach(function(p){
    var o=document.createElement('option'); o.value=p; o.textContent='('+p+')'; document.getElementById('pairPick').appendChild(o);
  });

  function render(){
    var only = pick.value || null;
    var out=document.getElementById('out'); out.innerHTML='';
    (only? [only] : order).forEach(function(id){ var el=drawSource(id); if(el) out.appendChild(el); });
  }
  pick.addEventListener('change', render);
  document.getElementById('ccOnly').addEventListener('change', render);
  document.getElementById('pairPick').addEventListener('change', render);
  render();
  document.querySelector('h1').textContent = 'Corpus by source — C-C blocks';
})();
</script></body></html>
