<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Avatarian transcription workbench</title>
<link rel="stylesheet" href="/site/css/blocks.css" />
<link rel="stylesheet" href="css/workbench.css" />
</head>
<body>

<header class="bar">
  <h1>Transcription workbench</h1>
  <span class="bar-note" id="corpusCount"></span>
  <span class="spacer"></span>
  <button type="button" id="importBtn">+ import a source</button>
  <span class="save-state" id="saveState"></span>
  <button type="button" id="saveBtn" class="primary">save corpus</button>
</header>

<p class="problems" id="problems" hidden></p>

<div class="layout">

<!-- ------------------------------------------------------------------ -->
<aside class="col-list">
  <div class="panel">
    <div class="panel-head">
      <h2>Entries</h2>
      <button type="button" id="newEntry" class="small">+ new</button>
    </div>
    <input type="search" id="filter" placeholder="filter…" />
    <ul class="entry-list" id="entryList"></ul>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h2>Sources</h2>
      <button type="button" id="newSource" class="small">+ new</button>
    </div>
    <ul class="source-list" id="sourceList"></ul>
  </div>
</aside>

<!-- ------------------------------------------------------------------ -->
<main class="col-edit">

<!-- The primary way in. A reference image almost never holds one word —
     it holds a line, a caption, a poster. So the unit of work is the
     SOURCE: drop its image, transcribe the whole thing in one go with
     "/" between words, and get one entry per word out.

     The per-entry editor below is for refining afterwards, not for
     getting things in. -->
<section class="panel" id="importPanel">
  <div class="panel-head">
    <h2>Import a source</h2>
    <button type="button" id="closeImport" class="small">close</button>
  </div>

  <div class="row">
    <label class="field grow">
      <span class="field-label">Source name <span class="fine">— how entries
        will cite it</span></span>
      <input type="text" id="impName" placeholder="fanny-poster" autocomplete="off" />
    </label>
    <label class="field">
      <span class="field-label">Confidence <span class="fine">— for all of them</span></span>
      <select id="impConfidence">
        <option value="certain">certain</option>
        <option value="probable">probable</option>
        <option value="unclear">unclear</option>
      </select>
    </label>
  </div>

  <div class="row">
    <!-- The full reading lives here, not just a label. A source is
         usually a line, a caption or a poster, and the words come off it
         one at a time — so without somewhere to keep the whole text, the
         only record of what the source SAYS is scattered across its
         entries with the order lost. -->
    <label class="field grow">
      <span class="field-label">What it is <span class="fine">— and what it
        says, in full</span></span>
      <textarea id="impWhat" rows="4"
        placeholder="A poster on the wall of the metal bending academy.&#10;&#10;“How is the metal bending academy? Cherries on top!”"></textarea>
    </label>
    <label class="field grow">
      <span class="field-label">Where it came from
        <span class="fine">— specific enough to find again</span></span>
      <textarea id="impWhere" rows="2"
        placeholder="Season 2 episode 7, background art at 04:12."></textarea>
    </label>
  </div>

  <div class="dropzone" id="impDrop">
    <img id="impImage" alt="" hidden />
    <p class="dropzone-hint" id="impDropHint">Drop the reference image here,
      or paste it.</p>
  </div>

  <!-- English in, a first draft of the sounds out.

       The spelling this produces is the MODEL's guess, not an
       observation, so every word it fills in starts UNCONFIRMED and
       cannot be saved until it has been compared with the image. Seeding
       the corpus from the model and saving it unchecked would record an
       inference as an attestation, which is the one thing the corpus
       exists to prevent (CORPUS.md §4, DECIPHERMENT.md on method). -->
  <label class="field">
    <span class="field-label">English
      <span class="fine">— type the line as you read it and get a first
        draft of the sounds. Every word it fills in has to be checked
        against the image before it can be saved.</span></span>
    <div class="english-row">
      <input type="text" id="impEnglish" autocomplete="off"
        placeholder="how is the metal bending academy?" />
      <button type="button" id="impDerive" class="small">derive sounds ↓</button>
    </div>
  </label>

  <label class="field">
    <span class="field-label">Transcription
      <span class="fine">— the whole source, <code>/</code> between words.
        Put the English in <code>(brackets)</code> if you already know it;
        anything you leave out gets suggested.</span></span>
    <textarea id="impText" rows="3" spellcheck="false"
      placeholder="F AE N IY / IH Z / M IH S IH NG 0"></textarea>
  </label>

  <div id="impRows"></div>

  <div class="import-actions">
    <button type="button" id="impAdd" class="primary">add entries</button>
    <button type="button" id="impCheckAll" class="small" hidden>all of them
      match the image</button>
    <span class="fine" id="impSummary"></span>
  </div>
</section>

  <!-- The source itself lives in the MAIN column, beside the words read
       off it. It was in the right-hand rail with the draw pad and the
       palette, which are tools; this is the material. A reference image
       squeezed into a 320px rail is also too small to read glyphs off,
       which is the one thing it exists for.

       The image and the two sentences sit side by side here, so the
       image gets the width and the writing does not have to fight it. -->
  <section class="panel" id="sourcePanel">
    <div class="panel-head">
      <h2>Source</h2>
      <span class="fine" id="imageName"></span>
    </div>

    <div class="source-body">
      <div class="source-image-col">
        <!-- Provenance, not input. Nothing here reads the pixels; the
             image is stored so that "where did this spelling come from"
             still has an answer in a year. -->
        <div class="dropzone" id="dropzone">
          <img id="sourceImage" alt="" hidden />
          <p class="dropzone-hint" id="dropHint">Drop the reference image here
            to file it against this source.</p>
        </div>
        <label class="zoom-ctl">zoom
          <input type="range" id="imageZoom" min="100" max="400" step="10" value="100" />
        </label>
      </div>

    <div id="sourceFields" class="source-fields-col" hidden>
      <label class="field">
        <span class="field-label">Name <span class="fine">— how entries cite it</span></span>
        <input type="text" id="srcName" autocomplete="off" />
      </label>
      <label class="field">
        <span class="field-label">What it is <span class="fine">— and what it
          says, in full</span></span>
        <textarea id="srcWhat" rows="4"></textarea>
      </label>
      <label class="field">
        <span class="field-label">Where it came from
          <span class="fine">— specific enough to find again</span></span>
        <textarea id="srcWhere" rows="2"></textarea>
      </label>

      <!-- Deleting a source has to take its entries with it: an entry
           citing a source that is gone fails validation, so leaving them
           behind would make the corpus unsaveable. The button says how
           many, because that is the part you cannot undo. -->
      <div class="source-actions">
        <button type="button" id="deleteSource" class="small danger">delete
          this source</button>
        <span class="fine" id="deleteSourceNote"></span>
      </div>
    </div>
    </div>
  </section>

  <!-- Everything read off one source, in one place.

       The entry list is per WORD and the editor is per entry, so until
       this there was no way to see a source as the thing it actually is:
       a line, a caption, a poster that somebody read in one sitting. It
       is also how you check a transcription — the words in the order
       they were written, beside the image they came off. -->
  <section class="panel" id="sourceView" hidden>
    <div class="panel-head">
      <h2 id="sourceViewTitle"></h2>
      <span class="fine" id="sourceViewCount"></span>
      <button type="button" id="closeSourceView" class="small">close</button>
    </div>
    <div class="source-words" id="sourceWords"></div>
  </section>

  <section class="panel" id="editor">
    <div class="panel-head">
      <h2 id="editorTitle">New entry</h2>
      <button type="button" id="deleteEntry" class="small danger" hidden>delete</button>
    </div>

    <label class="field">
      <span class="field-label">Avatarian transcription
        <span class="fine">— what you can read off the image, in order,
          two slots per block. Write the nulls.</span></span>
      <div class="sound-tools">
        <button type="button" class="tool-btn" data-insert="0"
                title="Null — a slot with no sound in it">0&nbsp;null</button>
        <button type="button" class="tool-btn" data-insert="*"
                title="A glyph you can see but cannot make out. It fills its
slot, so the block structure is still recorded.">*&nbsp;unreadable</button>
        <button type="button" class="tool-btn" data-insert="$"
                title="Force the glyph's top form">$&nbsp;top form</button>
        <button type="button" class="tool-btn" data-insert="%"
                title="Force the glyph's bottom form">%&nbsp;bottom form</button>
        <span class="spacer"></span>
        <button type="button" class="tool-btn" id="delToken" title="Remove the last sound">⌫</button>
        <button type="button" class="tool-btn" id="clearSpelling">clear</button>
      </div>
      <textarea id="spelling" rows="2" spellcheck="false"
        placeholder="AA 0 P 0 AA 0"></textarea>
    </label>

    <div class="preview">
      <div class="avatarian-output" id="preview"></div>
      <p class="preview-note" id="previewNote"></p>
    </div>

    <!-- The comparison that makes the corpus a research instrument
         rather than a spelling patch: what the model would have
         predicted, beside what canon actually does. -->
    <div class="compare" id="compare" hidden>
      <h3>Against the model</h3>
      <div id="compareBody"></div>
    </div>

    <label class="field">
      <span class="field-label">Word
        <span class="fine">— suggested from the sounds; click one or type
          your own.</span></span>
      <input type="text" id="key" placeholder="appa" autocomplete="off" />
    </label>
    <!-- Transcribing a word that is already in the corpus should take you
         to that entry, not quietly build a second one beside it. -->
    <p class="dupe" id="dupeWarn" hidden>
      <span id="dupeText"></span>
      <button type="button" id="dupeOpen" class="small">open it instead</button>
    </p>

    <!-- Every sighting of this word, because an entry is one sighting and
         a well-attested word has several. Without this the other ones are
         invisible from here: you would be editing one of four and have no
         way to see the other three, or which of them disagree. -->
    <section class="sightings" id="sightings" hidden>
      <h3 class="sightings-head">
        <span id="sightingsCount"></span>
        <span class="fine" id="sightingsNote"></span>
      </h3>
      <ul id="sightingsList"></ul>
    </section>
    <div class="suggestions" id="suggestions"></div>

    <div class="row">
      <label class="field grow">
        <span class="field-label">Gloss <span class="fine">— optional, how it's
          written in English</span></span>
        <input type="text" id="gloss" placeholder="Appa" autocomplete="off" />
      </label>
      <label class="field">
        <span class="field-label">Confidence</span>
        <select id="confidence">
          <option value="certain">certain</option>
          <option value="probable">probable</option>
          <option value="unclear">unclear</option>
        </select>
      </label>
      <!-- One entry is one (word, source, spelling); repeats in the same
           source are counted here rather than filed as duplicate entries the
           validator rejects. Bump this to record another sighting of a word
           already attested from this source. -->
      <label class="field">
        <span class="field-label">Seen here <span class="fine">— times in
          this source</span></span>
        <input type="number" id="times" min="1" step="1" value="1"
               inputmode="numeric" autocomplete="off" />
      </label>
    </div>

    <label class="field">
      <span class="field-label">Source <span class="fine">— which image this
        was read off</span></span>
      <select id="source"></select>
    </label>

    <label class="field">
      <span class="field-label">Note <span class="fine">— anything surprising
        about this spelling</span></span>
      <textarea id="note" rows="3"></textarea>
    </label>
  </section>
</main>

<!-- ------------------------------------------------------------------ -->
<aside class="col-tools">
  <section class="panel">
    <div class="panel-head"><h2>Draw a glyph</h2></div>
    <div id="drawpad"></div>
  </section>

  <section class="panel">
    <div class="panel-head"><h2>Palette</h2></div>
    <div class="palette" id="palette"></div>
  </section>
</aside>

</div>

<!-- The site's own files, read-only over /site/. The preview beside your
     transcription is drawn by the product's code, not a lookalike.

     lexicon.js is 1.6 MB and the deployed wiki gadget deliberately skips
     it — reverse-decode needs the whole dictionary to search against,
     and this is a tool running on your own laptop. -->
<script src="/site/js/manifest.js"></script>
<script src="/site/js/corpus.js"></script>
<script src="/site/js/lexicon.js"></script>
<script src="/site/js/g2p.js"></script>
<script src="/site/js/sounds.js"></script>
<script src="/site/js/render.js"></script>
<script src="/site/js/recognise.js"></script>
<script src="/site/js/reverse.js"></script>
<script src="/site/js/draw.js"></script>
<script src="js/app.js"></script>
</body>
</html>
