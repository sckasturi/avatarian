# Cloudflare Worker that turns a corpus submission into a pull request.
# See README.md for the full setup. Deploy with `wrangler deploy`.

name = "avatarian-contrib"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Non-secret configuration. The only secret is the GitHub App private key
# (GH_APP_PRIVATE_KEY), set with `wrangler secret put` and never in this file.
[vars]
REPO_OWNER = "sckasturi"         # <-- the GitHub account/org that owns the repo
REPO_NAME = "avatarian"          # <-- the repository name
BASE_BRANCH = "main"
ALLOWED_ORIGIN = "https://avatarian.techfilmer.com"
GH_APP_ID = "4945180"            # <-- the App's numeric ID (App settings)

# Per-IP daily rate limiting. Create the namespace once with
#   wrangler kv namespace create RATE
# then paste the id it prints here. Without this binding the Worker still
# runs — it just does not rate-limit.
# [[kv_namespaces]]
# binding = "RATE"
# id = "PASTE_THE_KV_NAMESPACE_ID_HERE"
